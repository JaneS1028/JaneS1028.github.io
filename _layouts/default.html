<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title and page.title != "About" %}{{ page.title }} · {% endif %}Jane Shin</title>
  <meta name="description" content="{{ page.description | default: site.description | default: 'Personal academic homepage of Jane Shin, KAIST.' }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a href="{{ '/' | relative_url }}" class="nav-logo">jane shin<span>.</span></a>
      <ul class="nav-links">
        <li><a href="{{ '/' | relative_url }}#research">Research</a></li>
        <li><a href="{{ '/assets/Jane_Shin_CV.pdf' | relative_url }}" target="_blank" rel="noopener">CV</a></li>
      </ul>
    </div>
  </nav>

  {{ content }}

  <footer>
    <p>© {{ 'now' | date: '%Y' }} Jane Shin &nbsp;·&nbsp; KAIST College of Business</p>
  </footer>

</body>
</html>
